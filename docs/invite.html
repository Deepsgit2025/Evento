<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>विवाह निमंत्रण</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #1a0e12; overflow-x: hidden; }
  body {
    font-family: 'Noto Sans Devanagari', 'Nirmala UI', 'Helvetica Neue', Arial, sans-serif;
    scroll-snap-type: y proximity;
    scroll-behavior: smooth;
  }
  #petals { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
  .section {
    position: relative;
    min-height: 100vh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 24px;
    scroll-snap-align: start;
    overflow: hidden;
  }
  .frame {
    position: absolute; inset: 14px;
    border: 2px solid var(--accent, #C9A24B);
    border-radius: 4px;
    pointer-events: none;
  }
  .frame::before {
    content: ''; position: absolute; inset: 7px;
    border: 1px solid var(--accent, #C9A24B); opacity: 0.6;
  }
  .toran { position: absolute; top: 18px; left: 0; width: 100%; opacity: 0.9; }
  .toran-bottom { position: absolute; bottom: 18px; left: 0; width: 100%; opacity: 0.9; transform: scaleY(-1); }
  .mandala { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.08; z-index: 0; width: 82vmin; height: 82vmin; }
  .scatter { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .content { position: relative; z-index: 1; max-width: 480px; }
  .om { font-size: 56px; color: var(--accent); margin-bottom: 4px; }
  .eyebrow { font-size: 13px; letter-spacing: 4px; color: var(--accent); margin-bottom: 14px; }
  .shloka { font-size: 15px; line-height: 1.9; font-style: italic; margin-bottom: 24px; opacity: 0.85; }
  .guest-name { font-size: 28px; font-weight: 700; margin-top: 8px; }
  .invite-label { font-size: 12px; letter-spacing: 4px; opacity: 0.75; margin-bottom: 6px; }
  .icon-wrap { margin-bottom: 20px; }
  .couple-names { font-size: 34px; font-weight: 700; line-height: 1.5; }
  .amp { font-size: 15px; color: var(--accent); margin: 4px 0; }
  .tagline { font-size: 15px; opacity: 0.8; margin: 16px 0 20px; }
  .message { font-size: 15px; line-height: 1.8; margin-bottom: 20px; }
  .info-row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
  .info-card { border: 1px solid var(--accent); border-radius: 8px; padding: 12px 20px; min-width: 150px; }
  .info-label { font-size: 10px; letter-spacing: 2px; color: var(--accent); margin-bottom: 6px; }
  .info-value { font-size: 15px; }
  .event-title { font-size: 34px; font-weight: 700; margin-bottom: 16px; }
  .event-meta { font-size: 16px; opacity: 0.9; margin-bottom: 4px; }
  .live-countdown { display: flex; gap: 14px; justify-content: center; margin: 22px 0; }
  .cd-box { min-width: 62px; }
  .cd-num { font-size: 30px; font-weight: 800; color: var(--accent); line-height: 1; }
  .cd-label { font-size: 10px; letter-spacing: 1px; opacity: 0.75; margin-top: 4px; }
  .divider { width: 100px; height: 1px; background: var(--accent); opacity: 0.6; margin: 18px 0; }
  .blessing { font-size: 14px; font-style: italic; opacity: 0.8; }
  .sticky-cd {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    background: rgba(0,0,0,0.55); color: #F5E9D3; border: 1px solid rgba(212,175,55,0.6);
    border-radius: 999px; padding: 8px 18px; font-size: 13px; letter-spacing: 0.5px;
    z-index: 60; backdrop-filter: blur(4px); display: none;
  }
  .sticky-cd b { color: #E8C979; }
  .scroll-hint {
    position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
    z-index: 2; opacity: 0.85; animation: bob 1.6s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 8px); } }
  #loading { color: #E8C979; text-align: center; padding: 80px 24px; font-size: 15px; }
</style>
</head>
<body>
  <canvas id="petals"></canvas>
  <div id="app"><div id="loading">निमंत्रण लोड हो रहा है…</div></div>
  <div class="sticky-cd" id="stickyCd"></div>

<script>
(function () {
  "use strict";

  // ---------- decode payload ----------
  function b64urlDecode(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  function escapeHtml(v) {
    return String(v || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  var data = null;
  try {
    var hash = window.location.hash || '';
    var m = /[#&]i=([^&]+)/.exec(hash);
    if (m) data = JSON.parse(b64urlDecode(m[1]));
  } catch (e) { data = null; }

  var app = document.getElementById('app');
  if (!data) {
    app.innerHTML = '<div id="loading">यह निमंत्रण लिंक अधूरा या अमान्य है।<br/>कृपया भेजने वाले से दोबारा लिंक माँगें।</div>';
    return;
  }

  // ---------- themes (mirror src/services/invitationThemes.ts) ----------
  var THEMES = {
    'royal-maroon': { darkBg: 'linear-gradient(160deg, #5C1220 0%, #7A1C29 55%, #5C1220 100%)', lightBg: '#FFFBF3', gold: '#C9A24B', goldMuted: '#D8C08E', textDark: '#3B2C22', textMuted: '#6B584A' },
    'emerald-gold': { darkBg: 'linear-gradient(160deg, #0B3D2E 0%, #145A43 55%, #0B3D2E 100%)', lightBg: '#F8FFF9', gold: '#D4AF37', goldMuted: '#B9D9C4', textDark: '#1F3A2E', textMuted: '#4C6459' },
    'royal-blue': { darkBg: 'linear-gradient(160deg, #0B1F3D 0%, #16305A 55%, #0B1F3D 100%)', lightBg: '#F7FAFF', gold: '#C9A24B', goldMuted: '#B7C4DE', textDark: '#1C2740', textMuted: '#51597A' },
    'blush-rosegold': { darkBg: 'linear-gradient(160deg, #5C1B3A 0%, #7A2C50 55%, #5C1B3A 100%)', lightBg: '#FFF7F9', gold: '#D9A66C', goldMuted: '#E7B9C9', textDark: '#4A2C36', textMuted: '#6E5460' },
    'ivory-copper': { darkBg: 'linear-gradient(160deg, #4A2C1D 0%, #6B3F27 55%, #4A2C1D 100%)', lightBg: '#FFFDF8', gold: '#B5652B', goldMuted: '#D9B693', textDark: '#3B2A1E', textMuted: '#6B5642' },
    'plum-silver': { darkBg: 'linear-gradient(160deg, #2E1A3D 0%, #46285C 55%, #2E1A3D 100%)', lightBg: '#FAF8FC', gold: '#9C7FB0', goldMuted: '#C9B8D6', textDark: '#2E2038', textMuted: '#5A4C66' }
  };
  var theme = THEMES[data.t] || THEMES['royal-maroon'];

  var EVENT_HINDI = {
    Haldi: 'हल्दी', Mehndi: 'मेहंदी', Sangeet: 'संगीत संध्या', 'DJ Night': 'डीजे नाइट',
    Baraat: 'बारात', Wedding: 'विवाह समारोह', Reception: 'स्वागत समारोह', Dinner: 'रात्रि भोज'
  };

  var EVENT_STYLE = {
    Haldi: { bg: '#F4A522', accent: '#7A4B00', text: '#4A2E00', icon: 'kalash', dots: '#FFD54F' },
    Mehndi: { bg: '#2F6B3A', accent: '#F3E7C4', text: '#F3E7C4', icon: 'hand', dots: '#8BC34A' },
    Sangeet: { bg: '#181233', accent: '#D4AF37', text: '#F3E7C4', icon: 'dhol', sparkle: '#D4AF37' },
    'DJ Night': { bg: '#150E2E', accent: '#FF4FA3', text: '#F3E7C4', icon: 'disco', sparkle: '#FF4FA3' },
    Baraat: { bg: '#5C1A24', accent: '#F1C77B', text: '#F6E4C1', icon: 'horse', petals: '#F27C93' },
    Reception: { bg: '#0B132B', accent: '#D4AF37', text: '#F3E7C4', icon: 'diya', sparkle: '#D4AF37' }
  };

  // ---------- icons ----------
  function icon(name, accent, size) {
    size = size || 96;
    var svgs = {
      diya: '<svg width="' + size + '" height="' + (size * 1.17) + '" viewBox="0 0 48 56"><path d="M4 40 Q24 54 44 40 Q41 29 24 29 Q7 29 4 40 Z" fill="none" stroke="' + accent + '" stroke-width="2.2"/><path d="M24 27 C19 20 24 15 24 8 C29 15 31 20 24 27 Z" fill="' + accent + '"/></svg>',
      mandap: '<svg width="' + (size * 1.6) + '" height="' + (size * 0.96) + '" viewBox="0 0 150 90"><path d="M14 86 V30 M136 86 V30 M14 30 Q75 4 136 30" fill="none" stroke="' + accent + '" stroke-width="2.5"/><path d="M40 86 V40 M110 86 V40" fill="none" stroke="' + accent + '" stroke-width="1.6" opacity="0.7"/><circle cx="75" cy="20" r="3.5" fill="' + accent + '"/><path d="M75 20 V10" stroke="' + accent + '" stroke-width="1.6"/></svg>',
      kalash: '<svg width="' + size + '" height="' + size + '" viewBox="0 0 64 64"><path d="M20 30 Q32 20 44 30 L40 52 Q32 58 24 52 Z" fill="' + accent + '" opacity="0.92"/><circle cx="32" cy="19" r="6" fill="' + accent + '"/><path d="M20 28 Q13 18 6 24" stroke="' + accent + '" stroke-width="2" fill="none"/><path d="M44 28 Q51 18 58 24" stroke="' + accent + '" stroke-width="2" fill="none"/><path d="M32 26 L32 8" stroke="' + accent + '" stroke-width="2" fill="none"/></svg>',
      hand: '<svg width="' + size + '" height="' + size + '" viewBox="0 0 64 64"><path d="M22 58 L22 32 Q22 26 26 26 Q30 26 30 32 L30 16 Q30 10 34 10 Q38 10 38 16 L38 32 Q38 22 42 22 Q46 22 46 32 L46 42 Q50 42 50 48 L50 58 Z" fill="none" stroke="' + accent + '" stroke-width="2.2"/><circle cx="30" cy="46" r="2" fill="' + accent + '"/><circle cx="38" cy="49" r="2" fill="' + accent + '"/><circle cx="34" cy="40" r="2" fill="' + accent + '"/></svg>',
      dhol: '<svg width="' + size + '" height="' + size + '" viewBox="0 0 64 64"><rect x="16" y="22" width="32" height="20" rx="4" fill="none" stroke="' + accent + '" stroke-width="2.2"/><ellipse cx="32" cy="22" rx="16" ry="6" fill="none" stroke="' + accent + '" stroke-width="2.2"/><ellipse cx="32" cy="42" rx="16" ry="6" fill="none" stroke="' + accent + '" stroke-width="2.2"/><path d="M18 26 L13 40 M46 26 L51 40" stroke="' + accent + '" stroke-width="1.6"/></svg>',
      horse: '<svg width="' + size + '" height="' + size + '" viewBox="0 0 64 64"><path d="M40 12 C48 14 51 24 46 30 L51 34 L44 37 L44 45 Q44 53 35 55 L25 55 Q29 47 25 41 Q17 39 17 28 Q17 15 29 13 Q34 9 40 12 Z" fill="none" stroke="' + accent + '" stroke-width="2.2"/><circle cx="38" cy="22" r="1.7" fill="' + accent + '"/></svg>',
      disco: '<svg width="' + (size * 0.8) + '" height="' + size + '" viewBox="0 0 80 100"><circle cx="40" cy="24" r="16" fill="none" stroke="' + accent + '" stroke-width="2"/><path d="M24 24 H56 M40 8 V40 M28 12 L52 36 M52 12 L28 36" stroke="' + accent + '" stroke-width="1" opacity="0.75"/><line x1="40" y1="40" x2="40" y2="54" stroke="' + accent + '" stroke-width="2"/><rect x="33" y="54" width="14" height="26" rx="7" fill="none" stroke="' + accent + '" stroke-width="2"/><line x1="40" y1="80" x2="40" y2="92" stroke="' + accent + '" stroke-width="2"/><line x1="30" y1="92" x2="50" y2="92" stroke="' + accent + '" stroke-width="2"/></svg>'
    };
    return svgs[name] || svgs.diya;
  }

  function toranStrip(accent, bottom) {
    var n = 14, spacing = 100 / n, leaves = '';
    for (var i = 0; i < n; i++) {
      var cx = (spacing * i + spacing / 2).toFixed(2);
      leaves += '<path d="M' + cx + ' 3 C ' + (cx - 3) + ' 9, ' + (cx - 3) + ' 15, ' + cx + ' 20 C ' + (Number(cx) + 3) + ' 15, ' + (Number(cx) + 3) + ' 9, ' + cx + ' 3 Z" fill="' + accent + '" opacity="0.85"/><circle cx="' + cx + '" cy="22" r="1" fill="' + accent + '" opacity="0.9"/>';
    }
    return '<svg class="' + (bottom ? 'toran-bottom' : 'toran') + '" viewBox="0 0 100 24" preserveAspectRatio="none" style="height:34px;"><line x1="0" y1="1" x2="100" y2="1" stroke="' + accent + '" stroke-width="0.6" opacity="0.55"/>' + leaves + '</svg>';
  }

  function mandala(accent) {
    var petals = '';
    for (var i = 0; i < 12; i++) {
      petals += '<path d="M100 100 C 100 46, 114 14, 100 2 C 86 14, 100 46, 100 100 Z" fill="none" stroke="' + accent + '" stroke-width="1" transform="rotate(' + (i * 30) + ' 100 100)"/>';
    }
    return '<svg class="mandala" viewBox="0 0 200 200"><circle cx="100" cy="100" r="96" fill="none" stroke="' + accent + '" stroke-width="1"/><circle cx="100" cy="100" r="72" fill="none" stroke="' + accent + '" stroke-width="1"/><circle cx="100" cy="100" r="6" fill="' + accent + '"/>' + petals + '</svg>';
  }

  function seeded(seed) { var x = Math.sin(seed * 9301 + 49297) * 233280; return x - Math.floor(x); }
  function scatter(kind, color, count, seedBase) {
    var shapes = '';
    for (var i = 0; i < count; i++) {
      var x = (seeded(seedBase + i * 3.1) * 100).toFixed(1);
      var y = (seeded(seedBase + i * 7.7 + 1) * 100).toFixed(1);
      var rot = Math.round(seeded(seedBase + i * 5.3 + 2) * 360);
      var scale = (0.6 + seeded(seedBase + i * 2.9 + 3) * 0.9).toFixed(2);
      if (kind === 'dot') {
        shapes += '<circle cx="' + x + '" cy="' + y + '" r="' + (0.7 * scale).toFixed(2) + '" fill="' + color + '" opacity="0.55"/>';
      } else if (kind === 'sparkle') {
        shapes += '<g transform="translate(' + x + ' ' + y + ') rotate(' + rot + ') scale(' + (scale * 0.14) + ')"><path d="M0 -7 L2 -2 L7 0 L2 2 L0 7 L-2 2 L-7 0 L-2 -2 Z" fill="' + color + '" opacity="0.65"/></g>';
      } else {
        shapes += '<g transform="translate(' + x + ' ' + y + ') rotate(' + rot + ') scale(' + (scale * 0.14) + ')"><path d="M0 -9 C 7 -7 7 7 0 11 C -7 7 -7 -7 0 -9 Z" fill="' + color + '" opacity="0.5"/></g>';
      }
    }
    return '<svg class="scatter" viewBox="0 0 100 100" preserveAspectRatio="none">' + shapes + '</svg>';
  }

  // ---------- date/time helpers ----------
  var HINDI_MONTHS = ['जनवरी','फ़रवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितम्बर','अक्टूबर','नवम्बर','दिसम्बर'];
  var HINDI_WEEKDAYS = ['रविवार','सोमवार','मंगलवार','बुधवार','गुरुवार','शुक्रवार','शनिवार'];
  function parseIso(v) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ''); if (!m) return null; return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])); }
  function formatDateHindi(v, withWeekday) {
    var d = parseIso(v); if (!d) return v || '';
    var base = d.getDate() + ' ' + HINDI_MONTHS[d.getMonth()] + ' ' + d.getFullYear();
    return withWeekday ? HINDI_WEEKDAYS[d.getDay()] + ', ' + base : base;
  }
  function formatTimeHindi(t) {
    var m = /^(\d{2}):(\d{2})$/.exec(t || ''); if (!m) return t || '';
    var h = parseInt(m[1], 10), min = m[2], period = 'रात';
    if (h >= 4 && h < 12) period = 'सुबह'; else if (h >= 12 && h < 16) period = 'दोपहर'; else if (h >= 16 && h < 19) period = 'शाम';
    var h12 = h % 12 === 0 ? 12 : h % 12;
    return h12 + ':' + min + ' ' + period;
  }

  // ---------- build sections ----------
  var sections = [];

  // 1. invocation
  var scrollHint = '<div class="scroll-hint"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="' + theme.gold + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
  sections.push(
    '<section class="section" style="--accent:' + theme.gold + '; background:' + theme.darkBg + '; color:#F5E9D3;">' +
      '<div class="frame"></div>' + mandala(theme.gold) + scatter('dot', theme.goldMuted, 14, 5) + toranStrip(theme.gold) + toranStrip(theme.gold, true) +
      '<div class="content">' +
        '<div class="om">ॐ</div>' +
        '<div class="eyebrow">॥ श्री गणेशाय नमः ॥</div>' +
        '<div class="shloka">वक्रतुण्ड महाकाय सूर्यकोटि समप्रभ।<br/>निर्विघ्नं कुरु मे देव सर्वकार्येषु सर्वदा॥</div>' +
        '<div class="divider"></div>' +
        '<div class="invite-label">सादर आमंत्रण</div>' +
        '<div class="guest-name">' + escapeHtml(data.n) + ' जी</div>' +
        '<div class="icon-wrap" style="margin-top:18px;">' + icon('diya', theme.gold, 70) + '</div>' +
      '</div>' +
      scrollHint +
    '</section>'
  );

  // 2. couple
  var coupleLine = (data.b && data.g) ? ('<div class="couple-names">' + escapeHtml(data.b) + '<div class="amp">&#10086;</div>' + escapeHtml(data.g) + '</div>') : '';
  var dateDisplay = data.d ? formatDateHindi(data.d) : '';
  var infoRow = '';
  if (dateDisplay) infoRow += '<div class="info-card"><div class="info-label">दिनांक</div><div class="info-value">' + escapeHtml(dateDisplay) + '</div></div>';
  if (data.v) infoRow += '<div class="info-card"><div class="info-label">स्थान</div><div class="info-value">' + escapeHtml(data.v) + '</div></div>';
  sections.push(
    '<section class="section" style="--accent:' + theme.gold + '; background:' + theme.lightBg + '; color:' + theme.textDark + ';">' +
      '<div class="frame"></div>' + mandala(theme.gold) + scatter('petal', '#E88BA0', 12, 8) + toranStrip(theme.gold) +
      '<div class="content">' +
        '<div class="eyebrow">विवाह निमंत्रण</div>' +
        '<div class="icon-wrap">' + icon('mandap', theme.gold, 70) + '</div>' +
        coupleLine +
        '<div class="tagline" style="color:' + theme.textMuted + ';">विवाह बंधन में बंधने जा रहे हैं</div>' +
        (data.m ? '<div class="message">' + escapeHtml(data.m).replace(/\n/g, '<br/>') + '</div>' : '') +
        '<div class="info-row">' + infoRow + '</div>' +
        (data.d ? '<div class="live-countdown" id="mainCountdown"></div>' : '') +
      '</div>' +
    '</section>'
  );

  // 3..N event pages
  (data.e || []).forEach(function (ev, idx) {
    var type = ev[0], evDate = ev[1], start = ev[2], end = ev[3], loc = ev[4];
    var style = EVENT_STYLE[type] || { bg: theme.lightBg, accent: theme.gold, text: theme.textDark, icon: 'mandap' };
    var label = EVENT_HINDI[type] || type;
    var dateLine = evDate ? formatDateHindi(evDate, true) : '';
    var timeLine = start ? (formatTimeHindi(start) + (end ? ' – ' + formatTimeHindi(end) : '')) : '';
    var decor = style.dots ? scatter('dot', style.dots, 26, 10 + idx * 17)
      : style.sparkle ? scatter('sparkle', style.sparkle, 20, 20 + idx * 17)
      : style.petals ? scatter('petal', style.petals, 20, 30 + idx * 17)
      : '';
    sections.push(
      '<section class="section" style="--accent:' + style.accent + '; background:' + style.bg + '; color:' + style.text + ';">' +
        '<div class="frame"></div>' + mandala(style.accent) + decor + toranStrip(style.accent) + toranStrip(style.accent, true) +
        '<div class="content">' +
          '<div class="icon-wrap">' + icon(style.icon, style.accent, 90) + '</div>' +
          '<div class="event-title">' + escapeHtml(label) + '</div>' +
          (dateLine ? '<div class="event-meta">' + escapeHtml(dateLine) + '</div>' : '') +
          (timeLine ? '<div class="event-meta">' + escapeHtml(timeLine) + '</div>' : '') +
          (loc ? '<div class="event-meta" style="opacity:0.75;">' + escapeHtml(loc) + '</div>' : '') +
        '</div>' +
      '</section>'
    );
  });

  // closing
  sections.push(
    '<section class="section" style="--accent:' + theme.gold + '; background:' + theme.darkBg + '; color:#F5E9D3;">' +
      '<div class="frame"></div>' + mandala(theme.gold) + scatter('dot', theme.goldMuted, 16, 90) + toranStrip(theme.gold) + toranStrip(theme.gold, true) +
      '<div class="content">' +
        '<div class="icon-wrap">' + icon('diya', theme.gold, 70) + '</div>' +
        '<div class="eyebrow">आपकी शुभकामनाएं और उपस्थिति</div>' +
        (data.d ? '<div class="live-countdown" id="closingCountdown"></div>' : '') +
        '<div style="font-size:16px; margin-bottom:6px;">कृपया अपनी उपस्थिति की पुष्टि करें</div>' +
        '<div class="divider"></div>' +
        '<div class="blessing">सपरिवार पधारने की कृपा करें</div>' +
      '</div>' +
    '</section>'
  );

  app.innerHTML = sections.join('');

  // ---------- live countdown ----------
  var target = parseIso(data.d);
  function renderCountdown(el) {
    if (!el || !target) return;
    var now = new Date();
    var diff = target.getTime() - now.getTime();
    if (diff < 0) diff = 0;
    var days = Math.floor(diff / 86400000);
    var hours = Math.floor((diff % 86400000) / 3600000);
    var mins = Math.floor((diff % 3600000) / 60000);
    var secs = Math.floor((diff % 60000) / 1000);
    el.innerHTML =
      '<div class="cd-box"><div class="cd-num">' + days + '</div><div class="cd-label">दिन</div></div>' +
      '<div class="cd-box"><div class="cd-num">' + hours + '</div><div class="cd-label">घंटे</div></div>' +
      '<div class="cd-box"><div class="cd-num">' + mins + '</div><div class="cd-label">मिनट</div></div>' +
      '<div class="cd-box"><div class="cd-num">' + secs + '</div><div class="cd-label">सेकंड</div></div>';
  }
  function tickCountdowns() {
    renderCountdown(document.getElementById('mainCountdown'));
    renderCountdown(document.getElementById('closingCountdown'));
    var sticky = document.getElementById('stickyCd');
    if (target && sticky) {
      var diff = target.getTime() - Date.now();
      if (diff > 0) {
        var days = Math.floor(diff / 86400000);
        sticky.style.display = 'block';
        sticky.innerHTML = (data.b && data.g ? escapeHtml(data.b) + ' ❤ ' + escapeHtml(data.g) + ' &middot; ' : '') + '<b>' + days + '</b> दिन शेष';
      } else {
        sticky.style.display = 'block';
        sticky.textContent = 'आज है शुभ दिन! 🎉';
      }
    }
  }
  if (target) { tickCountdowns(); setInterval(tickCountdowns, 1000); }

  // ---------- auto-scroll ----------
  var allSections = Array.prototype.slice.call(document.querySelectorAll('.section'));
  var idx = 0;
  var autoTimer = null;
  function goNext() {
    idx++;
    if (idx >= allSections.length) { clearInterval(autoTimer); autoTimer = null; return; }
    allSections[idx].scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function stopAutoScroll() {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  }
  setTimeout(function () {
    autoTimer = setInterval(goNext, 4200);
  }, 1800);
  ['wheel', 'touchstart', 'keydown'].forEach(function (evt) {
    window.addEventListener(evt, stopAutoScroll, { passive: true, once: true });
  });

  // ---------- falling rose petals ----------
  var canvas = document.getElementById('petals');
  var ctx = canvas.getContext('2d');
  var petals = [];
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();
  var PETAL_COLORS = ['#F2A6B4', '#E88BA0', '#D4AF37', '#F6D998'];
  for (var p = 0; p < 22; p++) {
    petals.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: 4 + Math.random() * 5,
      speed: 0.4 + Math.random() * 0.8,
      drift: Math.random() * 1.2 - 0.6,
      angle: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 0.02,
      color: PETAL_COLORS[p % PETAL_COLORS.length]
    });
  }
  function drawPetal(pt) {
    ctx.save();
    ctx.translate(pt.x, pt.y);
    ctx.rotate(pt.angle);
    ctx.fillStyle = pt.color;
    ctx.globalAlpha = 0.75;
    ctx.beginPath();
    ctx.moveTo(0, -pt.r);
    ctx.bezierCurveTo(pt.r * 0.8, -pt.r * 0.6, pt.r * 0.8, pt.r * 0.6, 0, pt.r * 1.2);
    ctx.bezierCurveTo(-pt.r * 0.8, pt.r * 0.6, -pt.r * 0.8, -pt.r * 0.6, 0, -pt.r);
    ctx.fill();
    ctx.restore();
  }
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = 0; i < petals.length; i++) {
      var pt = petals[i];
      pt.y += pt.speed;
      pt.x += pt.drift;
      pt.angle += pt.spin;
      if (pt.y > canvas.height + 20) { pt.y = -20; pt.x = Math.random() * canvas.width; }
      if (pt.x < -20) pt.x = canvas.width + 20;
      if (pt.x > canvas.width + 20) pt.x = -20;
      drawPetal(pt);
    }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
