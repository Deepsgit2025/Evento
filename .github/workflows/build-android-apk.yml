name: Build Android APK
# Redesign + dark-mode + crypto-crash fixes build

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/app-crash-launch-ux8p7w
    paths:
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild native Android project
        run: npx expo prebuild -p android --no-install

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Built: $APK_PATH"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: evento-release-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish APK to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Evento APK build #${{ github.run_number }}
          body: |
            Automated release APK build from commit ${{ github.sha }} on branch ${{ github.ref_name }}.
            This build uses the default debug signing config, same as `expo run:android` release builds — install directly on a device for testing.
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: true
