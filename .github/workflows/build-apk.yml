name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/wedding-app-improvements-on2t0f

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Prebuild Android project
        run: npx expo prebuild -p android --no-install

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk evento-preview.apk

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: evento-preview-${{ github.run_number }}
          name: Evento Preview APK (build ${{ github.run_number }})
          body: |
            Self-contained build for installing on a phone (JS bundle is embedded, no dev
            server needed) — download `evento-preview.apk` below, open it on your Android
            device, and allow "install from unknown sources" if prompted.
          files: evento-preview.apk
